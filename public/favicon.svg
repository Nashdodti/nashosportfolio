<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="64" height="64" rx="12" fill="url(#gradient)"/>
  
  <!-- Subtle grid pattern for data theme -->
  <g opacity="0.1">
    <line x1="0" y1="16" x2="64" y2="16" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="48" x2="64" y2="48" stroke="white" stroke-width="0.5"/>
    <line x1="16" y1="0" x2="16" y2="64" stroke="white" stroke-width="0.5"/>
    <line x1="32" y1="0" x2="32" y2="64" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="0" x2="48" y2="64" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- ND letters -->
  <text x="32" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">ND</text>
  
  <!-- Subtle highlight -->
  <rect width="64" height="32" rx="12" fill="url(#shine)" opacity="0.15"/>
  
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="shine" x1="32" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
